name: CI — Build, Test, Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 reached EOL 2025-04-30 and our runtime deps (inquirer 9
        # ESM-only) no longer support it. Test on supported LTS lines.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          CLI_VERSION=$(node dist/index.js --version 2>/dev/null || echo "UNKNOWN")
          if [ "$PKG_VERSION" != "$CLI_VERSION" ]; then
            echo "FAIL: package.json ($PKG_VERSION) != CLI ($CLI_VERSION)"
            exit 1
          fi
          echo "Version consistent: $PKG_VERSION"

      - name: Tarball install smoke
        # Catches the v2.1.0-class regression where a runtime dep is missing
        # from `dependencies` but tests pass against the dev tree because the
        # dep is installed via devDependencies. Packs, installs into a clean
        # tmpdir, exercises boot + subcommand --help (audit a11y/perf/mobile,
        # render, graph, completion), and statically resolves every
        # `import('<pkg>')` / `require('<pkg>')` in the installed dist/.
        # Subsumes the old `solid --help` / `solid completion` canary.
        run: npm run test:tarball

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Audit production dependencies (fail on HIGH)
        # We only ship runtime deps to npm, so dev-only advisories
        # (eslint, ts-jest, etc.) can't reach a user's machine. Match
        # what prepublishOnly enforces: `npm audit --omit=dev`.
        run: npm audit --omit=dev --audit-level=high

      - name: Check for known vulnerabilities in production deps (fail on HIGH)
        run: npx audit-ci --high --skip-dev

      - name: Verify no secrets in code
        run: |
          # Check for hardcoded tokens, keys, passwords. Excludes:
          #   - test files (mock fixtures)
          #   - redaction regexes (lines containing `.replace(` — those
          #     define patterns that REMOVE secrets from error strings,
          #     not secrets themselves)
          #   - pragma allowlist (`// pragma: allowlist secret`)
          if grep -rn "sk_live_\|sk_test_\|npm_[A-Za-z0-9]\{20,\}\|password.*=.*['\"]" src/ --include="*.ts" \
             | grep -v "test" \
             | grep -v "__tests__" \
             | grep -v "\.example" \
             | grep -v "\.replace(" \
             | grep -v "pragma: allowlist secret"; then
            echo "FAIL: Possible hardcoded secrets found"
            exit 1
          fi
          echo "No secrets detected"

      - name: Verify company isolation in tests
        run: |
          # All test setup must use company_id 99999, never real IDs
          if grep -rn "companyId: [0-9]" src/__tests__/ | grep -v "companyId: 99999" | grep -v "company_id: 42" | grep -v "RESERVED"; then
            echo "WARNING: Test uses non-standard company_id"
          fi
          echo "Company isolation check passed"
