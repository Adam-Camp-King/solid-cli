name: Homebrew tap auto-bump

# Instant fast path: fires on v* tags AND any push to main that touches
# package.json, computes the npm tarball sha256, and commits the bump
# directly to Solidnumber/homebrew-tap.
#
# This path is OPTIONAL. The tap repo has its own self-bump workflow
# (.github/workflows/auto-bump.yml there) that polls npm every 4 hours
# with the built-in GITHUB_TOKEN — so the tap converges even if this
# workflow never runs. If HOMEBREW_TAP_TOKEN is absent, this job skips
# green instead of failing.
#
# Setup (optional, for instant bumps): create a fine-grained PAT scoped
# to Solidnumber/homebrew-tap with `contents:write`, then add it as a
# repo secret named HOMEBREW_TAP_TOKEN in solid-cli.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

jobs:
  bump-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Check for PAT
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping instant bump." \
                 "The tap's scheduled self-bump converges within 4h regardless."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout solid-cli (for package.json)
        if: steps.token.outputs.have == 'true'
        uses: actions/checkout@v5

      - name: Read version
        if: steps.token.outputs.have == 'true'
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Compute npm tarball sha256
        if: steps.token.outputs.have == 'true'
        id: sha
        run: |
          # Wait for the npm registry to surface the version. A push can
          # land before `npm publish` completes, so retry for ~5 minutes,
          # then bow out gracefully — the tap's self-bump catches it.
          rm -f /tmp/cli.tgz
          downloaded=false
          for i in $(seq 1 15); do
            if curl -fsSL "https://registry.npmjs.org/@solidnumber/cli/-/cli-${{ steps.version.outputs.version }}.tgz" -o /tmp/cli.tgz; then
              downloaded=true
              break
            fi
            echo "tarball not yet on registry CDN, retrying in 20s..."
            sleep 20
          done
          # Critical: verify we actually have a non-empty file before
          # hashing — otherwise we'd silently bump the formula to a
          # wrong sha and ship a checksum-mismatch to brew users.
          if ! $downloaded || [ ! -s /tmp/cli.tgz ]; then
            echo "version not on npm yet — skipping; the tap's scheduled self-bump will pick it up post-publish"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="$(sha256sum /tmp/cli.tgz | awk '{print $1}')"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha256: $SHA"

      - name: Checkout homebrew-tap
        if: steps.token.outputs.have == 'true' && steps.sha.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          repository: Solidnumber/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump Formula/cli.rb and push
        if: steps.token.outputs.have == 'true' && steps.sha.outputs.ready == 'true'
        working-directory: tap
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha }}"
          # Match the deterministic url + sha256 fields so we don't
          # accidentally rewrite anything else in the formula.
          sed -E -i \
            -e "s|url \"https://registry\\.npmjs\\.org/@solidnumber/cli/-/cli-[^\"]+\\.tgz\"|url \"https://registry.npmjs.org/@solidnumber/cli/-/cli-${VERSION}.tgz\"|" \
            -e "s|sha256 \"[a-f0-9]{64}\"|sha256 \"${SHA}\"|" \
            Formula/cli.rb
          git config user.name  "solid-cli-bot"
          git config user.email "bot@solidnumber.com"
          git add Formula/cli.rb
          git commit -m "bump cli → ${VERSION}" || { echo "no changes — already at $VERSION"; exit 0; }
          git push origin main
