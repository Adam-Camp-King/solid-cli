name: Scoop bucket auto-bump

# Mirrors .github/workflows/homebrew-bump.yml but for Scoop. Instant
# fast path: fires on v* tags AND any push to main touching
# package.json, then commits the bump directly to
# Solidnumber/scoop-bucket.
#
# This path is OPTIONAL. The bucket repo has its own self-bump workflow
# that polls npm every 4 hours with the built-in GITHUB_TOKEN — so the
# bucket converges even if this workflow never runs. If
# SCOOP_BUCKET_TOKEN is absent, this job skips green instead of failing.
#
# Setup (optional, for instant bumps): create a fine-grained PAT scoped
# to Solidnumber/scoop-bucket with `contents:write`, then add it as a
# repo secret named SCOOP_BUCKET_TOKEN in solid-cli.

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

jobs:
  bump-bucket:
    runs-on: ubuntu-latest
    steps:
      - name: Check for PAT
        id: token
        env:
          TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "SCOOP_BUCKET_TOKEN not set — skipping instant bump." \
                 "The bucket's scheduled self-bump converges within 4h regardless."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout solid-cli (for package.json)
        if: steps.token.outputs.have == 'true'
        uses: actions/checkout@v5

      - name: Read version
        if: steps.token.outputs.have == 'true'
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute npm tarball sha256
        if: steps.token.outputs.have == 'true'
        id: sha
        run: |
          # Wait for the npm registry to surface the version, then bow
          # out gracefully if it never appears — the bucket's self-bump
          # catches it post-publish.
          rm -f /tmp/cli.tgz
          downloaded=false
          for i in $(seq 1 15); do
            if curl -fsSL "https://registry.npmjs.org/@solidnumber/cli/-/cli-${{ steps.version.outputs.version }}.tgz" -o /tmp/cli.tgz; then
              downloaded=true
              break
            fi
            echo "tarball not yet on registry CDN, retrying in 20s..."
            sleep 20
          done
          if ! $downloaded || [ ! -s /tmp/cli.tgz ]; then
            echo "version not on npm yet — skipping; the bucket's scheduled self-bump will pick it up post-publish"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="$(sha256sum /tmp/cli.tgz | awk '{print $1}')"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout scoop-bucket
        if: steps.token.outputs.have == 'true' && steps.sha.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          repository: Solidnumber/scoop-bucket
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: bucket

      - name: Update bucket/solid.json and push
        if: steps.token.outputs.have == 'true' && steps.sha.outputs.ready == 'true'
        working-directory: bucket
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha }}"
          # Use jq to update the deterministic fields. Safer than sed
          # because JSON quoting is fiddly and we don't want to corrupt
          # the manifest.
          jq --arg v "$VERSION" --arg s "$SHA" \
            '.version = $v
             | .url = ("https://registry.npmjs.org/@solidnumber/cli/-/cli-" + $v + ".tgz")
             | .hash = ("sha256:" + $s)' \
            bucket/solid.json > bucket/solid.json.new
          mv bucket/solid.json.new bucket/solid.json
          git config user.name  "solid-cli-bot"
          git config user.email "bot@solidnumber.com"
          git add bucket/solid.json
          git commit -m "bump solid → ${VERSION}" || { echo "no changes — already at $VERSION"; exit 0; }
          git push origin main
